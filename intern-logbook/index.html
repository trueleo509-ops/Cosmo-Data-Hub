<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intern Logbook</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1c2230; --muted: #667085; --line: #e3e6ec;
    --accent: #2f6fed; --accent-ink: #ffffff; --ok: #1a8f5a; --warn: #c27a00; --bad: #c63b3b;
    --track: #e9edf5; --row-alt: #fafbfc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1b2029; --ink: #e7eaf0; --muted: #98a2b3; --line: #2c3340;
      --accent: #5b8cff; --accent-ink: #0d1117; --ok: #3ccf8e; --warn: #f0b429; --bad: #ff6b6b;
      --track: #262d3a; --row-alt: #1f2530;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between;
           padding: 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  main > *, .grid2 > * { min-width: 0; } /* let the wide table scroll inside its card instead of widening the page */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 6px; padding: 7px 9px; min-width: 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
           border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.link { border: none; background: none; color: var(--bad); padding: 2px 6px; }
  button:hover { filter: brightness(0.96); }
  .muted { color: var(--muted); font-size: 13px; }

  /* Interns: weekly progress */
  .intern { display: grid; gap: 10px; }
  .intern-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .intern-head b { font-size: 16px; }
  .bar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .bar.done > span { background: var(--ok); }
  .status { font-size: 13px; font-weight: 600; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); }

  /* Entry form */
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
  .sig-wrap { display: grid; gap: 4px; }
  canvas#sig { width: 100%; height: 110px; background: #fff; border: 1px dashed var(--muted);
               border-radius: 6px; touch-action: none; cursor: crosshair; }
  .hours-preview { font-size: 22px; font-weight: 700; }

  /* Sheet */
  .week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .week-nav b { font-size: 15px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td img { height: 34px; background: #fff; border-radius: 4px; border: 1px solid var(--line); }
  tfoot td { font-weight: 700; border-bottom: none; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }

  details summary { cursor: pointer; font-weight: 600; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }

  @media print {
    header .row, .no-print, details { display: none !important; }
    body { background: #fff; color: #000; }
    .card { border: none; padding: 0; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📒 Intern Logbook</h1>
    <p id="subtitle">Daily attendance &amp; weekly hours</p>
  </div>
  <div class="row">
    <button id="btn-export">Export to Excel (CSV)</button>
    <button id="btn-print">Print week</button>
  </div>
</header>

<main>
  <!-- Interns: weekly progress -->
  <section class="grid2" id="interns"></section>

  <!-- New entry -->
  <section class="card no-print">
    <h2>Log attendance</h2>
    <form id="entry" class="form" autocomplete="off">
      <label>Intern <select id="f-intern" required></select></label>
      <label>Date <input type="date" id="f-date" required></label>
      <label>Time in <input type="time" id="f-in" required></label>
      <label>Time out <input type="time" id="f-out" required></label>
      <div><div class="muted">Hours</div><div class="hours-preview" id="f-hours">0.00</div></div>
      <div class="sig-wrap" style="grid-column: 1 / -1">
        <div class="row" style="justify-content: space-between">
          <span class="muted">Signature (draw with mouse or finger)</span>
          <button type="button" id="sig-clear">Clear</button>
        </div>
        <canvas id="sig"></canvas>
      </div>
      <div class="row" style="grid-column: 1 / -1">
        <button type="submit" class="primary">Save entry</button>
        <span class="muted" id="f-msg"></span>
      </div>
    </form>
  </section>

  <!-- Weekly sheet -->
  <section class="card">
    <div class="week-nav">
      <button id="wk-prev">◀ Prev week</button>
      <b id="wk-label"></b>
      <div class="row">
        <button id="wk-today">This week</button>
        <button id="wk-next">Next week ▶</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Intern</th><th>Time in</th><th>Time out</th><th>Signature</th>
              <th class="num">Hours</th><th class="num">Week to date</th><th class="no-print"></th></tr>
        </thead>
        <tbody id="sheet"></tbody>
        <tfoot id="sheet-foot"></tfoot>
      </table>
    </div>
  </section>

  <!-- Settings -->
  <section class="card no-print">
    <details id="settings-box">
      <summary>⚙️ Settings — supervisor, intern names, weekly target</summary>
      <form id="settings" class="settings">
        <label>Supervisor name <input id="s-supervisor" placeholder="e.g. Mr. Smith"></label>
        <label>Weekly hour target <input id="s-target" type="number" min="1" step="0.5"></label>
        <label>Intern 1 name <input id="s-name-0"></label>
        <label>Intern 2 name <input id="s-name-1"></label>
        <div class="row" style="grid-column: 1 / -1">
          <button type="submit" class="primary">Save settings</button>
          <button type="button" id="btn-backup">Download backup (JSON)</button>
          <label style="display:inline-flex" class="muted"><span>Restore backup</span>
            <input type="file" id="btn-restore" accept="application/json"></label>
        </div>
      </form>
    </details>
  </section>
</main>

<script>
(() => {
  const KEY = 'intern-logbook-v1';
  const $ = (id) => document.getElementById(id);

  // ---------- State ----------
  const defaults = {
    settings: {
      supervisor: '', target: 20,
      interns: [{ name: 'Intern 1' }, { name: 'Intern 2' }],
    },
    entries: [], // { id, intern (0|1), date 'YYYY-MM-DD', in 'HH:MM', out 'HH:MM', hours, sig (dataURL) }
  };
  let state = load();
  let weekStart = mondayOf(todayISO());

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        return { settings: { ...defaults.settings, ...s.settings }, entries: s.entries || [] };
      }
    } catch (e) { /* storage unavailable: fall back to defaults */ }
    return structuredClone(defaults);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { alert('Could not save — browser storage is full or blocked. Download a backup.'); }
  }

  // ---------- Date helpers (local time, ISO strings) ----------
  function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function todayISO() { return iso(new Date()); }
  function mondayOf(s) { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }
  function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function fmtDate(s) { return parse(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); }
  function fmtTime(t) {
    const [h, m] = t.split(':').map(Number);
    return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
  }
  function hoursBetween(tin, tout) {
    if (!tin || !tout) return 0;
    const [h1, m1] = tin.split(':').map(Number), [h2, m2] = tout.split(':').map(Number);
    return Math.round(((h2 * 60 + m2) - (h1 * 60 + m1)) / 60 * 100) / 100;
  }
  const h2 = (n) => n.toFixed(2);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function weekEntries(start) {
    const end = addDays(start, 6);
    return state.entries.filter((e) => e.date >= start && e.date <= end)
      .sort((a, b) => (a.date + a.in).localeCompare(b.date + b.in) || a.intern - b.intern);
  }
  function weekTotal(start, intern) {
    return weekEntries(start).filter((e) => e.intern === intern).reduce((s, e) => s + e.hours, 0);
  }

  // ---------- Render ----------
  function render() {
    const { settings } = state;
    const target = Number(settings.target) || 20;
    $('subtitle').textContent = settings.supervisor
      ? `Supervisor: ${settings.supervisor} · Target ${target} hrs/week per intern`
      : `Daily attendance · Target ${target} hrs/week per intern`;

    // Intern cards
    $('interns').innerHTML = settings.interns.map((it, i) => {
      const done = weekTotal(weekStart, i);
      const pct = Math.min(100, (done / target) * 100);
      const left = Math.max(0, target - done);
      return `<div class="card intern">
        <div class="intern-head"><b>${esc(it.name)}</b><span class="muted">${h2(done)} / ${target} hrs</span></div>
        <div class="bar ${done >= target ? 'done' : ''}"><span style="width:${pct}%"></span></div>
        <div class="status ${done >= target ? 'ok' : 'warn'}">${done >= target ? '✓ Weekly hours complete' : `${h2(left)} hrs remaining this week`}</div>
      </div>`;
    }).join('');

    // Intern dropdown
    const sel = $('f-intern'), prev = sel.value;
    sel.innerHTML = settings.interns.map((it, i) => `<option value="${i}">${esc(it.name)}</option>`).join('');
    if (prev) sel.value = prev;

    // Week sheet
    const end = addDays(weekStart, 6);
    $('wk-label').textContent = `Week of ${fmtDate(weekStart)} – ${fmtDate(end)}`;
    const rows = weekEntries(weekStart);
    const running = [0, 0];
    $('sheet').innerHTML = rows.length ? rows.map((e) => {
      running[e.intern] += e.hours;
      return `<tr>
        <td>${fmtDate(e.date)}</td>
        <td>${esc(settings.interns[e.intern]?.name ?? '?')}</td>
        <td>${fmtTime(e.in)}</td><td>${fmtTime(e.out)}</td>
        <td>${e.sig ? `<img src="${e.sig}" alt="signature">` : '<span class="muted">—</span>'}</td>
        <td class="num">${h2(e.hours)}</td>
        <td class="num">${h2(running[e.intern])} / ${target}</td>
        <td class="no-print"><button class="link" data-del="${e.id}" title="Delete entry">✕</button></td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" class="empty">No attendance logged for this week yet.</td></tr>`;

    $('sheet-foot').innerHTML = settings.interns.map((it, i) => {
      const t = weekTotal(weekStart, i);
      return `<tr><td colspan="5">Weekly total — ${esc(it.name)}</td>
        <td class="num">${h2(t)}</td>
        <td class="num" style="color:var(${t >= target ? '--ok' : '--warn'})">${t >= target ? 'Complete' : h2(target - t) + ' left'}</td>
        <td class="no-print"></td></tr>`;
    }).join('');

    // Settings form
    $('s-supervisor').value = settings.supervisor;
    $('s-target').value = target;
    settings.interns.forEach((it, i) => { $(`s-name-${i}`).value = it.name; });
  }

  // ---------- Signature pad ----------
  const canvas = $('sig'), ctx = canvas.getContext('2d');
  let drawing = false, signed = false, ink = null; // ink = bounding box of strokes (CSS px)
  function sizeCanvas() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    signed = false; ink = null;
  }
  function pos(ev) {
    const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    ink = ink ? { x0: Math.min(ink.x0, x), y0: Math.min(ink.y0, y), x1: Math.max(ink.x1, x), y1: Math.max(ink.y1, y) } : { x0: x, y0: y, x1: x, y1: y };
    return [x, y];
  }
  canvas.addEventListener('pointerdown', (ev) => { drawing = true; canvas.setPointerCapture(ev.pointerId); ctx.beginPath(); ctx.moveTo(...pos(ev)); });
  canvas.addEventListener('pointermove', (ev) => { if (!drawing) return; ctx.lineTo(...pos(ev)); ctx.stroke(); signed = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => canvas.addEventListener(t, () => { drawing = false; }));
  $('sig-clear').onclick = sizeCanvas;
  window.addEventListener('resize', () => { if (!signed) sizeCanvas(); });

  function signatureData() {
    // Crop to the drawn area and downscale (keeping proportions) to keep storage small
    const W = 240, H = 70, pad = 4, dpr = canvas.width / canvas.getBoundingClientRect().width;
    const sx = Math.max(0, ink.x0 - pad) * dpr, sy = Math.max(0, ink.y0 - pad) * dpr;
    const sw = Math.min(canvas.width - sx, (ink.x1 - ink.x0 + pad * 2) * dpr), sh = Math.min(canvas.height - sy, (ink.y1 - ink.y0 + pad * 2) * dpr);
    const k = Math.min(W / sw, H / sh), dw = sw * k, dh = sh * k;
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
    o.drawImage(canvas, sx, sy, sw, sh, (W - dw) / 2, (H - dh) / 2, dw, dh);
    return out.toDataURL('image/png');
  }

  // ---------- Entry form ----------
  const updatePreview = () => { $('f-hours').textContent = h2(Math.max(0, hoursBetween($('f-in').value, $('f-out').value))); };
  $('f-in').oninput = $('f-out').oninput = updatePreview;

  $('entry').onsubmit = (ev) => {
    ev.preventDefault();
    const msg = $('f-msg');
    const intern = Number($('f-intern').value), date = $('f-date').value, tin = $('f-in').value, tout = $('f-out').value;
    const hours = hoursBetween(tin, tout);
    if (hours <= 0) { msg.textContent = '⚠️ Time out must be after time in.'; return; }
    if (!signed) { msg.textContent = '⚠️ Please sign before saving.'; return; }
    if (state.entries.some((e) => e.intern === intern && e.date === date && tin < e.out && tout > e.in)) {
      msg.textContent = '⚠️ This overlaps an existing entry for that intern on that day.'; return;
    }
    state.entries.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), intern, date, in: tin, out: tout, hours, sig: signatureData() });
    save();
    weekStart = mondayOf(date);
    $('f-in').value = ''; $('f-out').value = ''; updatePreview(); sizeCanvas();
    const total = weekTotal(weekStart, intern), target = Number(state.settings.target) || 20;
    msg.textContent = `✓ Saved. ${state.settings.interns[intern].name}: ${h2(total)} of ${target} hrs this week.`;
    render();
  };

  $('sheet').onclick = (ev) => {
    const id = ev.target.dataset?.del;
    if (!id || !confirm('Delete this entry?')) return;
    state.entries = state.entries.filter((e) => e.id !== id);
    save(); render();
  };

  // ---------- Week navigation ----------
  $('wk-prev').onclick = () => { weekStart = addDays(weekStart, -7); render(); };
  $('wk-next').onclick = () => { weekStart = addDays(weekStart, 7); render(); };
  $('wk-today').onclick = () => { weekStart = mondayOf(todayISO()); render(); };

  // ---------- Settings ----------
  $('settings').onsubmit = (ev) => {
    ev.preventDefault();
    const s = state.settings;
    s.supervisor = $('s-supervisor').value.trim();
    s.target = Math.max(1, Number($('s-target').value) || 20);
    s.interns = [0, 1].map((i) => ({ name: $(`s-name-${i}`).value.trim() || `Intern ${i + 1}` }));
    save(); render();
    $('settings-box').open = false;
  };

  // ---------- Export / backup ----------
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('btn-export').onclick = () => {
    const target = Number(state.settings.target) || 20;
    const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [['Week of', 'Date', 'Intern', 'Time in', 'Time out', 'Signed', 'Hours', 'Week to date', 'Weekly target'].map(q).join(',')];
    const sorted = [...state.entries].sort((a, b) => (a.date + a.in).localeCompare(b.date + b.in));
    const running = {};
    for (const e of sorted) {
      const wk = mondayOf(e.date), k = wk + '|' + e.intern;
      running[k] = (running[k] || 0) + e.hours;
      lines.push([wk, e.date, state.settings.interns[e.intern]?.name ?? '?', e.in, e.out, e.sig ? 'Yes' : 'No', h2(e.hours), h2(running[k]), target].map(q).join(','));
    }
    download(`intern-logbook-${todayISO()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
  };
  $('btn-print').onclick = () => window.print();
  $('btn-backup').onclick = () => download(`intern-logbook-backup-${todayISO()}.json`, JSON.stringify(state), 'application/json');
  $('btn-restore').onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.entries)) throw new Error('bad file');
      if (!confirm(`Replace current data with backup (${data.entries.length} entries)?`)) return;
      state = { settings: { ...defaults.settings, ...data.settings }, entries: data.entries };
      save(); render();
    } catch { alert('That file is not a valid logbook backup.'); }
    ev.target.value = '';
  };

  // ---------- Init ----------
  $('f-date').value = todayISO();
  render();
  sizeCanvas();
})();
</script>
</body>
</html>
